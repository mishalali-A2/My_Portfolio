  <!-- Contact Form -->
  <table width="60%" align="center" cellpadding="30">
    <tr>
      <td>
        <h2 align="center">Mail Me</h2>
        <form target="_blank" action="https://formsubmit.co/1e27e370991372bf0f8a6f3e05cb916c" method="POST">
          <input type="hidden" name="_subject" value="New message from your website!">
          <input type="hidden" name="_captcha" value="false">
          <table width="100%" cellpadding="10">
            <tr>
              <td width="30%"><font size="4"><b>Name:</b></font></td>
              <td><input type="text" name="name" size="40" style="width: 350px;" required></td>
            </tr>
            <tr>
              <td><font size="4"><b>Email:</b></font></td>
              <td><input type="email" name="email" size="40" style="width: 350px;" required></td>
            </tr>
            <tr>
              <td><font size="4"><b>Purpose:</b></font></td>
              <td>
                <select name="purpose" required>
                  <option value="" disabled selected>Select a purpose</option>
                  <option value="feedback">Feedback</option>
                  <option value="inquiry">Inquiry</option>
                  <option value="collaboration">Collaboration</option>
                  <option value="other">Other</option>
                </select>
              </td>
            </tr>
            <tr>
              <td valign="top"><font size="4"><b>Message:</b></font></td>
              <td><textarea name="message" rows="5" style="width: 350px;" required></textarea></td>
            </tr>
            <tr>
              <td colspan="2" align="center">
                <button type="submit" style="background-color: #A7C1A8; padding: 10px 20px; font-size: 16px;">Send Message</button>
              </td>
            </tr>
          </table>
        </form>
      </td>
    </tr>
  </table>

  <footer>
